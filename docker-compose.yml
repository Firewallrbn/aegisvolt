services:
  floci:
    image: floci/floci:latest
    container_name: floci
    user: root
    restart: unless-stopped # vuelve solo si Docker Desktop se reinicia
    ports:
      - "4566:4566"
    environment:
      FLOCI_STORAGE_MODE: hybrid # sin esto el estado se pierde al reiniciar
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock # requerido por EKS (k3s)

volumes:
  floci-data:
