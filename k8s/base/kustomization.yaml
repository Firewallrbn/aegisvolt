apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisvolt
resources:
  - namespace.yaml
  - graphql-gateway.yaml
  - station-reservation.yaml
  - billing-wallet.yaml
  - energy-dispatch.yaml

# Igual en los 3 ambientes; cada overlay agrega APP_ENV y el endpoint de su VPC
configMapGenerator:
  - name: aegisvolt-config
    literals:
      - AWS_REGION=us-east-1
      - RESERVATION_URL=http://station-reservation:4001
      - BILLING_URL=http://billing-wallet:4002
      - DISPATCH_URL=http://energy-dispatch:4003

# Credenciales de prueba de Floci. shortcut: en AWS real se reemplaza por IRSA (rol IAM por service account).
secretGenerator:
  - name: aws-credentials
    literals:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
