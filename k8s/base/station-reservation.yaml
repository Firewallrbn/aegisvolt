# shortcut: 1 réplica por la RAM del PC; con 1 réplica el canary queda 50/50 durante el análisis. Subir a 5 en AWS real.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: station-reservation
  labels: { app: station-reservation }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 90 # un canary que no queda listo en 90 s (ej. imagen rota) se aborta solo
  progressDeadlineAbort: true
  selector:
    matchLabels: { app: station-reservation }
  strategy:
    canary:
      canaryService: station-reservation-canary
      steps:
        - setWeight: 20
        - analysis:
            templates: [{ templateName: canary-health }]
            args:
              - { name: service, value: station-reservation }
              - { name: port, value: "4001" }
  template:
    metadata:
      labels: { app: station-reservation }
    spec:
      containers:
        - name: station-reservation
          image: station-reservation
          ports: [{ containerPort: 4001 }]
          env: [{ name: PORT, value: "4001" }]
          envFrom:
            - configMapRef: { name: aegisvolt-config }
            - secretRef: { name: aws-credentials }
          readinessProbe: { httpGet: { path: /health, port: 4001 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 4001 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: station-reservation
spec:
  selector: { app: station-reservation }
  ports: [{ port: 4001, targetPort: 4001 }]
---
apiVersion: v1
kind: Service
metadata:
  name: station-reservation-canary
spec:
  selector: { app: station-reservation }
  ports: [{ port: 4001, targetPort: 4001 }]
