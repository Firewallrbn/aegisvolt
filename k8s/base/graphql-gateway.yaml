# Canary sin service mesh: el tráfico se reparte por proporción de pods.
# 5 réplicas -> al 20% hay 1 pod canary y 4 estables detrás del mismo Service (1 de cada 5 peticiones).
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: graphql-gateway
  labels: { app: graphql-gateway }
spec:
  replicas: 5
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 90 # un canary que no queda listo en 90 s (ej. imagen rota) se aborta solo
  progressDeadlineAbort: true
  selector:
    matchLabels: { app: graphql-gateway }
  strategy:
    canary:
      canaryService: graphql-gateway-canary # solo para que el análisis consulte a los pods nuevos
      steps:
        - setWeight: 20
        - analysis:
            templates: [{ templateName: canary-health }]
            args:
              - { name: service, value: graphql-gateway }
              - { name: port, value: "4000" }
  template:
    metadata:
      labels: { app: graphql-gateway }
    spec:
      containers:
        - name: graphql-gateway
          image: graphql-gateway # el deploy reemplaza por <ECR>/aegisvolt/graphql-gateway:<tag>
          ports: [{ containerPort: 4000 }]
          env: [{ name: PORT, value: "4000" }]
          envFrom:
            - configMapRef: { name: aegisvolt-config }
            - secretRef: { name: aws-credentials }
          readinessProbe: { httpGet: { path: /health, port: 4000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 4000 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 192Mi }
---
# NodePort fijo: el NLB interno (target group tipo ip) apunta a <IP del nodo en la VPC>:30400.
# Selecciona estables y canary a la vez: así el canary recibe su proporción de tráfico real.
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway
spec:
  type: NodePort
  selector: { app: graphql-gateway }
  ports: [{ port: 4000, targetPort: 4000, nodePort: 30400 }]
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway-canary
spec:
  selector: { app: graphql-gateway } # Argo le agrega el hash de la versión canary
  ports: [{ port: 4000, targetPort: 4000 }]
